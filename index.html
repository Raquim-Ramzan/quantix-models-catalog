<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantix AI — Models Catalog</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #09090b;
      color: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 32px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { margin-top: 0; color: #00f2fe; font-size: 24px; }
    p { color: #a1a1aa; font-size: 14px; line-height: 1.6; }
    a.btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 20px;
      background: #00f2fe;
      color: #09090b;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    a.btn:hover { opacity: 0.9; }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● Live Service</div>
    <h1>Quantix AI Model Catalog</h1>
    <p>Official continuous distribution endpoint for the Quantix AI open-weights model library.</p>
    <a href="models_catalog.json" class="btn">View models_catalog.json</a>
  </div>
</body>
</html>
